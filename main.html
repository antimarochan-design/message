<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    font-family: 'Quicksand', sans-serif;
    h2 {
    font-family: 'Dancing Script', cursive;
    font-size: 28px;
}
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background:
        radial-gradient(circle at top left, rgba(255,180,200,0.35), transparent 40%),
        radial-gradient(circle at bottom right, rgba(255,120,160,0.35), transparent 45%),
        linear-gradient(135deg, #7b1e3a, #c44569, #ff6f91);
}

/* Soft glow */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.06), transparent 45%);
    animation: romanticGlow 18s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
}

@keyframes romanticGlow {
    from { opacity: 0.6; }
    to { opacity: 0.9; }
}

/* LIGHT PARTICLES */
.lights {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}
.light {
    position: absolute;
    width: 10px;
    height: 5px;
    background: radial-gradient(circle, rgba(255,255,255,0.9), transparent);
    border-radius: 50%;
    animation: drift linear infinite;
}
@keyframes drift {
    from {
        transform: translateY(120vh);
        opacity: 0;
    }
    15% { opacity: 0.8; }
    to {
        transform: translateY(-140vh);
        opacity: 0;
    }
}

/* FLOWERS */
.flowers {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}
.flower {
    position: absolute;
    top: 110%;
    opacity: 0.35;
    animation: floatUp linear infinite;
}
@keyframes floatUp {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(-150vh) rotate(360deg); }
}

/* GLASS CARDS */
.card, .choice-container, .transition, .message {
    position: relative;
    z-index: 2;
    background: linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
    backdrop-filter: blur(14px);
    padding: 40px 30px;
    border-radius: 22px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    display: none;
}

/* BORDER GLOW */
.card::before,
.choice-container::before,
.transition::before,
.message::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 24px;
    padding: 6px;
    background: linear-gradient(120deg,#ee2266,#ffd1dc,#ff6f91);
    animation: borderPulse 1.3s ease-in-out infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
}

@keyframes borderPulse {
    0% { box-shadow: 0 0 14px rgba(255,120,150,0.4); }
    50% { box-shadow: 0 0 30px rgba(255,140,170,1); }
    100% { box-shadow: 0 0 14px rgba(255,120,150,0.4); }
}

/* BUTTONS */
button {
    padding: 12px 25px;
    font-size: 18px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    min-width: 120px;
}

#openBtn, #yesBtn {
    background: white;
    color: #ff4d6d;
}

#noBtn {
    background: #ff4d6d;
    color: white;
    position: relative;
}

.button-row {
    margin-top: 30px;
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

/* POPUP */
.popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
}

.popup-box {
    background: linear-gradient(145deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1));
    backdrop-filter: blur(14px);
    border-radius: 22px;
    padding: 35px 30px;
    max-width: 380px;
    width: 85%;
    text-align: center;
    animation: popupIn 0.4s ease;
    box-shadow: 0 0 45px rgba(255,120,160,0.9);
}

@keyframes popupIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.popup-buttons {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.popup-buttons .soft {
    background: rgba(255,255,255,0.3);
    color: white;
}

/* TYPEWRITER */
#typeText {
    line-height: 1.7;
    white-space: pre-line;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: white;
    animation: blink 1s infinite;
}
@keyframes blink {
    50% { opacity: 0; }
}

/* CONFETTI */
.heart {
    position: fixed;
    top: -10px;
    font-size: 20px;
    animation: fall 5s linear forwards;
}
@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* SHOW FIRST */
.card { display: block; }

</style>
</head>

<body>

<div class="lights"></div>
<div class="flowers"></div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
<source src="Fitterkarma - Kalapastangan (Trend Lyrics Loop).mp3">
</audio>

<!-- HEARTBEAT -->
<audio id="heartbeat">
<source src="Heartbeat Sounds effects No Copyright HD.mp3">
</audio>

<div class="card" id="mainCard">
    <h1>Happy Valentine's Day 🌹</h1>
    <button onclick="showChoice()">Open Message 💌</button>
</div>

<div class="choice-container" id="choiceBox">
    <h1>Do you want to read my Valentine message?</h1>
    <div class="button-row">
        <button id="yesBtn" onclick="openPopup()">Yes </button>
        <button id="noBtn" onclick="noClicked()">No </button>
    </div>
</div>

<div class="transition" id="transitionBox">
    <h1>One moment…</h1>
    <p>Please be patient with me while I gather the courage to express myself to you. </p>
</div>

<div class="message" id="valMessage">
    <h1>Dear Miah,</h1>
    <p id="typeText"></p>
</div>

<!-- POPUP -->
<div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
        <h2> Wait…</h2>
        <p>Once you open this,<br>there’s no turning back</p>
        <div class="popup-buttons">
            <button onclick="confirmYes()">Open </button>
            <button class="soft" onclick="closePopup()">Not yet </button>
        </div>
    </div>  
</div>

<script>
/* LIGHTS */
setInterval(() => {
    if (document.querySelector(".lights").children.length > 90) return;

    const l = document.createElement("div");
    l.className = "light";
    l.style.left = Math.random() * 100 + "vw";

    // Faster movement
    l.style.animationDuration = Math.random() * 6 + 6 + "s";

    document.querySelector(".lights").appendChild(l);
    setTimeout(() => l.remove(), 12000);
}, 160);


/* FLOWERS */
const flowerIcons=["🌸"];
setInterval(() => {
    if (document.querySelector(".flowers").children.length > 25) return;
    const f=document.createElement("div");
    f.className="flower";
    f.textContent=flowerIcons[Math.floor(Math.random()*flowerIcons.length)];
    f.style.fontSize=Math.random()*20+24+"px";
    f.style.left=Math.random()*80+10+"%";
    f.style.animationDuration=Math.random()*12+16+"s";
    document.querySelector(".flowers").appendChild(f);
    setTimeout(()=>f.remove(),28000);
},600);

/* FLOW CONTROL */
function showChoice(){
    mainCard.style.display="none";
    choiceBox.style.display="block";
}

function openPopup(){
    popupOverlay.style.display="flex";
    heartbeat.currentTime=0;
    heartbeat.play();
}

function closePopup(){
    popupOverlay.style.display="none";
    heartbeat.pause();
}

function confirmYes(){
    heartbeat.pause();
    popupOverlay.style.display="none";
    startTransition();
}

function startTransition(){
    choiceBox.style.display="none";
    transitionBox.style.display="block";
    fadeInMusic();
    setTimeout(()=>{
        transitionBox.style.display="none";
        valMessage.style.display="block";
        typeWriter();
    },8000);
}

/* MUSIC */
function fadeInMusic(){
    const m=bgMusic;
    m.volume=0;
    m.play();
    let v=0;
    const fade=setInterval(()=>{
        v+=0.02;
        m.volume=Math.min(v,0.6);
        if(v>=0.6) clearInterval(fade);
    },200);
}

/* MESSAGE */
const msg=`
I hope this message finds you well. I just wanted to take a moment to tell you how much I admire you. I’ve been secretly admiring you from afar for quite some time now. I’m not really the expressive type of person, and I don’t even know why I’m doing this. I always thought doing things like this was a waste of time, but here I am now, confessing to the girl I like.

Every time I see you or when you’re near me, I can’t focus. I can’t look at you eye to eye because you make me nervous. I don’t know if you’ve noticed it, but whenever you’re around, I end up doing dumb things. I know this may come as a surprise, and I don’t want to make things awkward between us.

I’m not expecting anything in return. No matter what your answer is, I’m thankful I got the chance to be honest about how I feel.`;

function typeWriter(){
    const t=typeText;
    t.innerHTML="";
    let i=0;
    const c=document.createElement("span");
    c.className="cursor";
    t.appendChild(c);

    const int=setInterval(()=>{
        if(i<msg.length){
            c.insertAdjacentText("beforebegin",msg[i++]);
        }else{
            clearInterval(int);
            c.remove();
            confetti();
        }
    },40);
}

/* CONFETTI */
function confetti(){
    for(let i=0;i<30;i++){
        const h=document.createElement("div");
        h.className="heart";
        h.textContent="💕";
        h.style.left=Math.random()*100+"vw";
        h.style.animationDuration=Math.random()*5+5+"s";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),6000);
    }
}

/* NO BUTTON */
let yesSize=1;
function noClicked(){
    yesSize+=0.1;
    yesBtn.style.transform=`scale(${yesSize})`;

    const row=document.querySelector(".button-row");
    noBtn.style.position="absolute";

    const maxX=row.clientWidth-noBtn.offsetWidth;
    const maxY=row.clientHeight-noBtn.offsetHeight;

    noBtn.style.left=Math.random()*maxX+"px";
    noBtn.style.top=Math.random()*maxY+"px";
}
</script>

</body>
</html>
